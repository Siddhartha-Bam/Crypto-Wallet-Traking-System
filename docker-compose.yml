services:
  postgres:
    image: postgres:16-alpine
    container_name: kestrel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: crypto_dev_password
      POSTGRES_DB: crypto_trace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
